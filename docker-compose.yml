x-app-environment: &app-environment
  # UI mode:
  # - live-ui: html/css/js are loaded from mounted folders and apply after `docker compose restart app`
  # - ""      : html/css/js are loaded only from app.jar
  SPRING_PROFILES_ACTIVE: live-ui
  DB_URL: jdbc:postgresql://db:5432/geofields
  DB_USERNAME: postgres
  DB_PASSWORD: 12345
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  SERVER_PORT: 8080
  NDVI_PYTHON_BASE_URL: http://python-processor:8000
  GEOJSON_AGENT_BASE_URL: http://geojson-agent:6767
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET_NDVI: geofields-ndvi
  S3_BUCKET_TILES: geofields-tiles
  S3_ENABLED: "true"

x-app-volumes: &app-volumes
  - ./geoFields/build/libs/geoFields-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  - ./geoFields/src/main/resources/templates:/app/live-resources/templates:ro
  - ./geoFields/src/main/resources/static:/app/live-resources/static:ro

x-python-environment: &python-environment
  DATABASE_URL: postgresql://postgres:12345@db:5432/geofields
  GEE_PROJECT_ID: ""
  GEE_SERVICE_ACCOUNT: ""
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET_NDVI: geofields-ndvi
  S3_BUCKET_TILES: geofields-tiles
  S3_ENABLED: "true"

x-python-volumes: &python-volumes
  - ./python-service:/app
  - ./shared-data:/app/storage

x-geojson-agent-environment: &geojson-agent-environment
  OLLAMA_BASE_URL: http://ollama:11434
  MODEL_NAME: qwen2.5:14b

x-geojson-agent-volumes: &geojson-agent-volumes
  - ./geojson-agent/data:/app/data:ro
  - ./geojson-agent/output:/app/output
  - ./geojson-agent/temp:/app/temp

services:
  minio:
    image: minio/minio:latest
    #platform: linux/amd64
    container_name: geofields-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgis/postgis:17-3.5
    #platform: linux/amd64
    container_name: geofields-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geofields
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./LAST_BCUP_BD.sql:/docker-entrypoint-initdb.d/01_LAST_BCUP_BD.dump:ro
      - ./docker/postgres-init/02_restore_backup.sh:/docker-entrypoint-initdb.d/02_restore_backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geofields"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    #platform: linux/amd64
    container_name: geofields-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command:
      -url=jdbc:postgresql://db:5432/geofields
      -user=postgres
      -password=12345
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      migrate
    volumes:
      - ./sql:/flyway/sql

  # Одноразовая индексация .tif из /app/storage/raw → таблица scenes (после миграций)
  scene-indexer:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "app.utils.index_scenes"]
    environment: *python-environment
    volumes: *python-volumes
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  app:
    image: eclipse-temurin:21-jre-alpine
    #platform: linux/amd64
    container_name: geofields-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      python-processor:
        condition: service_started
      minio:
        condition: service_healthy
    environment: *app-environment
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    volumes: *app-volumes
    ports:
      - "8080:8080"

  python-processor:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: python_processor
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment: *python-environment
    volumes: *python-volumes
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      scene-indexer:
        condition: service_completed_successfully

  # --- AI: Ollama (LLM) + geojson-agent (shapefile → GeoJSON) ---
  # Модель qwen2.5:14b скачивается при первом старте ollama (volume ollama_data).
  # Без GPU закомментируйте блок deploy / gpus — Ollama будет на CPU.
  ollama:
    image: ollama/ollama:latest
    container_name: geofields-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: qwen2.5:14b
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen2.5:14b"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 1800s

  geojson-agent:
    build:
      context: ./geojson-agent
      dockerfile: Dockerfile
    container_name: geofields-geojson-agent
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment: *geojson-agent-environment
    volumes: *geojson-agent-volumes
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
