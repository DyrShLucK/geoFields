x-app-environment: &app-environment
  # UI mode:
  # - live-ui: html/css/js are loaded from mounted folders and apply after `docker compose restart app`
  # - ""      : html/css/js are loaded only from app.jar
  SPRING_PROFILES_ACTIVE: live-ui
  DB_URL: jdbc:postgresql://db:5432/geofields
  DB_USERNAME: postgres
  DB_PASSWORD: 12345
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  SERVER_PORT: 8080

x-app-volumes: &app-volumes
  - ./geoFields/build/libs/geoFields-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  - ./geoFields/src/main/resources/templates:/app/live-resources/templates:ro
  - ./geoFields/src/main/resources/static:/app/live-resources/static:ro

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: geofields-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geofields
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./LAST_BCUP_BD.sql:/docker-entrypoint-initdb.d/01_LAST_BCUP_BD.dump:ro
      - ./docker/postgres-init/02_restore_backup.sh:/docker-entrypoint-initdb.d/02_restore_backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geofields"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: geofields-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: eclipse-temurin:21-jre-alpine
    platform: linux/amd64
    container_name: geofields-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    volumes: *app-volumes
    ports:
      - "8080:8080"

  python-processor:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: python_processor
    ports:
      - "8001:8000"
    volumes:
      - ./python-service:/app
      - ./shared-data:/app/storage
    environment:
      - DATABASE_URL=postgresql://postgres:12345@db:5432/geofields
      - GEE_PROJECT_ID=
      - GEE_SERVICE_ACCOUNT=
    depends_on:
      - db

  flyway:
    image: flyway/flyway
    depends_on:
      - db
    command:
      -url=jdbc:postgresql://db:5432/geofields
      -user=postgres
      -password=12345
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      migrate
    volumes:
      - ./sql:/flyway/sql

volumes:
  postgres_data:
  redis_data: