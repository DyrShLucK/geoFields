services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-qwen
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: ["ai-net"]

  api:
    build: .
    container_name: geojson-api
    ports: ["6767:6767"]
    depends_on: ["ollama"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=qwen2.5:14b
    networks: ["ai-net"]
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
      - ./temp:/app/temp
    restart: unless-stopped

networks:
  ai-net:
    driver: bridge

volumes:
  ollama_data: