<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/app-pages.css}">
    <style>
        body.geo-page-auth .wrap button {
            background: #2f80ed;
        }
    </style>
</head>
<body class="geo-page-auth">
<div class="wrap">
    <h1>Вход</h1>
    <div class="hint ok" th:if="${param.pending != null}">Заявка отправлена. После одобрения менеджера организации вы сможете войти.</div>
    <div class="hint ok" th:if="${param.logout != null}">Вы вышли из системы.</div>
    <div class="hint err" th:if="${param.error != null}">Неверный логин или пароль.</div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label for="login">Логин</label>
        <input id="login" name="login" required autocomplete="username" />

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />

        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
