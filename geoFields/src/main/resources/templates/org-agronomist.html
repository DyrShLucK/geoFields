<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История посевов — агроном</title>
    <link rel="stylesheet" th:href="@{/css/app-pages.css}">
</head>
<body class="geo-page-org">
<div class="card">
    <h1>История посевов по полям</h1>
    <p>Организация: <strong id="org-name">…</strong> · <span id="user-label">…</span></p>
    <p><a th:href="@{/}">На карту</a></p>
    <div id="banner"></div>
</div>

<div class="card">
    <h2>Выбор поля</h2>
    <p style="font-size: 14px; color: #444;">В списке только поля, по которым уже есть записи в истории посевов. Загрузите историю и при необходимости добавьте год.</p>
    <div class="row">
        <label for="field-select" style="margin-right: 8px;">Поле:</label>
        <select id="field-select" style="min-width: 220px;">
            <option value="">— выберите поле —</option>
        </select>
        <button type="button" class="primary" id="btn-load-history">Показать историю</button>
    </div>
</div>

<div class="card" id="history-card" style="display: none;">
    <h2>Записи по выбранному полю</h2>
    <div id="history-wrap"></div>
</div>

<div class="card" id="form-card" style="display: none;">
    <h2 id="form-title">Новая запись</h2>
    <div class="row" style="flex-wrap: wrap; gap: 12px; align-items: flex-end;">
        <div>
            <label for="form-crop">Культура</label><br>
            <select id="form-crop"></select>
        </div>
        <div>
            <label for="form-year">Год поля (crop_year)</label><br>
            <input type="number" id="form-year" min="1900" max="2100" step="1" style="width: 100px;">
        </div>
        <div>
            <label for="form-sowing">Дата посева</label><br>
            <input type="date" id="form-sowing">
        </div>
        <div>
            <label for="form-harvest">Дата уборки</label><br>
            <input type="date" id="form-harvest">
        </div>
    </div>
    <div class="row" style="flex-wrap: wrap; gap: 12px; margin-top: 12px; align-items: flex-end;">
        <div>
            <label for="form-sown-ha">Засеяно, га</label><br>
            <input type="number" id="form-sown-ha" step="0.01" style="width: 120px;">
        </div>
        <div>
            <label for="form-harvest-ha">Убрано, га</label><br>
            <input type="number" id="form-harvest-ha" step="0.01" style="width: 120px;">
        </div>
        <div>
            <label for="form-actual-yield">Урожайность (факт)</label><br>
            <input type="number" id="form-actual-yield" step="0.01" style="width: 120px;">
        </div>
        <div>
            <label for="form-total-yield">Валовый сбор</label><br>
            <input type="number" id="form-total-yield" step="0.01" style="width: 120px;">
        </div>
    </div>
    <div class="row" style="flex-wrap: wrap; gap: 12px; margin-top: 12px; align-items: flex-end;">
        <div>
            <label for="form-planned-yield">План урожайности</label><br>
            <input type="number" id="form-planned-yield" step="0.01" style="width: 120px;">
        </div>
        <div>
            <label for="form-forecast-yield">Прогноз</label><br>
            <input type="number" id="form-forecast-yield" step="0.01" style="width: 120px;">
        </div>
        <div style="flex: 1; min-width: 200px;">
            <label for="form-source">Источник данных</label><br>
            <input type="text" id="form-source" maxlength="50" style="width: 100%; max-width: 320px;">
        </div>
    </div>
    <div style="margin-top: 12px;">
        <label for="form-details">Детали посева</label><br>
        <input type="text" id="form-details" maxlength="100" style="width: 100%; max-width: 560px;">
    </div>
    <div class="row" style="margin-top: 16px;">
        <button type="button" class="primary" id="btn-save-record">Сохранить</button>
        <button type="button" id="btn-cancel-edit">Отмена</button>
        <button type="button" class="primary" id="btn-new-record">Новая запись</button>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/agronomist.js}"></script>
</body>
</html>
