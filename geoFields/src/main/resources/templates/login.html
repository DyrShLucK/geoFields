<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему — GeoFields</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-header">
        <!-- Чистый профессиональный путь к вашему логотипу -->
             <div class="auth-logo">
        <img th:src="@{/images/logo.png}" alt="GeoFields" class="logo-image"/>
            </div>
        <h1>Рады видеть вас снова</h1>
        <p class="auth-subtitle">Войдите в свою учетную запись для доступа к агромониторингу</p>
    </div>

        <!-- Уведомления бэкенда -->
        <div class="alert alert-success" th:if="${param.pending != null}">
            Заявка зарегистрирована. Дождитесь одобрения менеджера организации.
        </div>
        <div class="alert alert-info" th:if="${param.logout != null}">
            Сессия успешно завершена. Вы вышли из системы.
        </div>
        <div class="alert alert-danger" th:if="${param.error != null}">
            Неверный логин или пароль. Повторите попытку.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <div class="input-group">
                <label for="login">Логин / Имя пользователя</label>
                <input id="login" name="login" type="text" required autocomplete="username" placeholder="Пользователь" />
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
            </div>

            <button type="submit" class="auth-btn">Войти в систему</button>
        </form>
  </div>
</body>
</html>
