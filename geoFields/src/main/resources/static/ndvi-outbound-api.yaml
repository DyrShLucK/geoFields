openapi: 3.0.3
info:
  title: Python NDVI API (Agro Service Pro)
  description: |
    Спецификация Python-сервиса расчёта и выдачи NDVI-тайлов.

    Используется Java backend (`NdviPythonClient`) как outbound API для:
    - получения URL шаблона тайлов NDVI для выбранных полей;
    - получения тренда NDVI за период;
    - выдачи PNG-тайлов для подложки карты (MapLibre GL).

    Базовый URL в docker-compose: `http://localhost:8001` (порт 8001 проброшен на контейнер `python-processor`).
  version: 1.0.0

servers:
  - url: http://localhost:8001
    description: Локальный Python-сервис NDVI

tags:
  - name: NDVI
    description: Расчёт NDVI и выдача URL тайлов / тренда
  - name: Tiles
    description: Выдача PNG-тайлов NDVI

paths:
  /get_ndvi_tiles_for_field:
    get:
      tags: [NDVI]
      summary: Получить URL тайлов NDVI для поля
      description: |
        Возвращает URL-шаблон тайлов для поля на указанную дату.
        Если расчёта нет — инициирует вычисление, сохраняет результат и возвращает URL.
      operationId: getNdviTilesForField
      parameters:
        - name: field_id
          in: query
          required: true
          schema:
            type: string
          example: "12"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2024-06-15"
      responses:
        "200":
          description: URL тайлов и фактическая дата снимка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NdviTilesForFieldResponse"
        "404":
          description: Нет доступных спутниковых данных (сцены не найдены)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Ошибка расчёта/БД
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get_ndvi_trend:
    get:
      tags: [NDVI]
      summary: Тренд NDVI для группы полей за период
      description: |
        Java может предварительно вызвать `/get_ndvi_tiles_for_field` по месяцам
        (warmup-оркестрация на своей стороне), затем вызвать этот endpoint.
      operationId: getNdviTrend
      parameters:
        - name: field_id
          in: query
          required: true
          description: Идентификаторы полей (повторяющийся query-параметр)
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          example: [12, 15]
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2024-04-01"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2024-09-01"
      responses:
        "200":
          description: Данные для построения графика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NdviTrendResponse"
        "500":
          description: Ошибка расчёта/БД
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get_ndvi_by_id:
    get:
      tags: [NDVI]
      summary: Получить URL тайлов NDVI (альтернативный эндпоинт)
      description: |
        Аналогично `get_ndvi_tiles_for_field`, используется как совместимость.
      operationId: getNdviById
      parameters:
        - name: field_id
          in: query
          required: true
          schema:
            type: string
          example: "12"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2024-06-15"
      responses:
        "200":
          description: URL тайлов и фактическая дата снимка (может отсутствовать)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NdviByIdResponse"
        "404":
          description: Нет доступных спутниковых данных
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Ошибка расчёта/БД
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tiles/{field_id}/{date}/{scene_id}/{z}/{x}/{y}.png:
    get:
      tags: [Tiles]
      summary: PNG-тайл NDVI для подложки карты
      description: |
        Возвращает PNG-тайл для заданного поля, даты, сцены и XYZ координат тайла.
        Используется картографическим компонентом (MapLibre GL) как raster tiles.
      operationId: getNdviPngTile
      parameters:
        - name: field_id
          in: path
          required: true
          schema: { type: string }
          example: "12"
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
          example: "2024-06-15"
        - name: scene_id
          in: path
          required: true
          schema: { type: string }
          example: "S2A_20240615"
        - name: z
          in: path
          required: true
          schema: { type: integer }
          example: 10
        - name: x
          in: path
          required: true
          schema: { type: integer }
          example: 615
        - name: y
          in: path
          required: true
          schema: { type: integer }
          example: 342
      responses:
        "200":
          description: PNG изображение тайла
          content:
            image/png:
              schema:
                type: string
                format: binary

components:
  schemas:
    NdviTilesForFieldResponse:
      type: object
      properties:
        url:
          type: string
          description: URL шаблон тайлов `{z}/{x}/{y}`
          example: "http://localhost:8001/tiles/12/2024-06-15/S2A_20240615/{z}/{x}/{y}.png"
        actual_date:
          type: string
          format: date
          description: Фактическая дата снимка (может отличаться от запрошенной)
          example: "2024-06-15"

    NdviByIdResponse:
      type: object
      properties:
        url:
          type: string
          description: URL шаблон тайлов `{z}/{x}/{y}`
        actual_date:
          type: string
          format: date
          nullable: true

    NdviTrendResponse:
      type: object
      properties:
        labels:
          type: array
          items: { type: string }
          description: Подписи (месяцы) для графика
          example: ["Apr", "May", "Jun"]
        data:
          type: array
          items: { type: number, format: double }
          description: Значения NDVI по точкам графика
          example: [0.41, 0.55, 0.62]

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Нет доступных спутниковых данных"
